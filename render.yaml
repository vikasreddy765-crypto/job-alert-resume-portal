services:
  - type: web
    name: pathway-job-portal
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
